<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NavBar</title>
  <style>
    body {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }

    #navbar {
      display: flex;
      /* border: 1px solid red; */
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      color: #fff;
      padding: 10px 5px;
    }

    button {
      background-color: #333;
      color: #fff;
      box-shadow: unset;
      border: 1px solid white;
      padding: 8px;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <nav id="navbar">
    <div class="nav-child">
      <p>Webdev cohot 2026 / HTML CSS Class</p>
    </div>
    <div class="nav-child">
      <div class="nav-center-button-container">
        <button>document</button>
        <button>both</button>
        <button>Canvas</button>
      </div>
    </div>
    <div class="nav-child">
      <div class="nav-end-button-container">
        <button>CMD K</button>
        <button>Share</button>
      </div>
    </div>
  </nav>

</body>

</html>
